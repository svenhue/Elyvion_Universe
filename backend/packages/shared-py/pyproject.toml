[project]
name = "elyvion-shared"
version = "0.1.0"
description = "Shared services and patterns for Elyvion Python backend modules"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "structlog>=24.4.0",
  "asyncpg>=0.30.0",
  "pymongo>=4.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elyvion_shared"]
