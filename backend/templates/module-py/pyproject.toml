[project]
name = "elyvion-module-py-template"
version = "0.1.0"
description = "FastAPI module skeleton — clone this folder to start a new Elyvion Python module"
requires-python = ">=3.11"
dependencies = [
  "elyvion-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "apscheduler>=3.10.0",
]

[tool.uv.sources]
elyvion-shared = { path = "../../packages/shared-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
