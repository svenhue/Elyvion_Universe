[project]
name = "elyvion-platform"
version = "0.1.0"
description = "Shared Elyvion platform services for logs and files"
requires-python = ">=3.11"
dependencies = [
  "elyvion-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
elyvion-shared = { path = "../packages/shared-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
