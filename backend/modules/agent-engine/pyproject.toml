[project]
name = "agent-engine"
version = "0.1.0"
description = "Runs an LLM-designed team of agents against a task, using actions-engine (via MCP) as their tools"
requires-python = ">=3.11"
dependencies = [
  "elyvion-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "anthropic>=0.40.0",
  "mcp>=1.0.0",
  "langgraph>=0.2.0",
]

[tool.uv.sources]
elyvion-shared = { path = "../../packages/shared-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
