[project]
name = "ontology-engine"
version = "0.1.0"
description = "Enterprise ontology modeling — nodes, relationships and attributes as a graph, backed by Neo4j"
requires-python = ">=3.11"
dependencies = [
  "elyvion-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "neo4j>=5.24.0",
]

[tool.uv.sources]
elyvion-shared = { path = "../../packages/shared-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
