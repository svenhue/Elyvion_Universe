    environment:
      PORT: "3030"
      MODULE_NAME: elyvion_platform
      MODULE_BASE_URL: http://elyvion-platform:3030
      REGISTRY_URL: http://registry:3010
      AUTH_ISSUER_URL: http://localhost:3011
      DATABASE_URL: postgresql://elyvion:elyvion@postgres:5432/elyvion
      MONGODB_URI: mongodb://mongo:27017/elyvion_files
      TRAFFIC_INGEST_URL: http://traffic:3025/internal/events
      TRAFFIC_INGEST_TOKEN_FILE: /run/secrets/traffic_ingest_token
    secrets:
      - traffic_ingest_token
    depends_on:
      registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck: *python-healthcheck
    ports:
      - "127.0.0.1:3030:3030"

secrets:
  security_internal_token:
    file: ./.secrets/users_service_token
  security_operator_token:
    file: ./.secrets/security_operator_token
  secret_store_keys:
    file: ./.secrets/secret_store_keys.json
  secret_store_workloads:
    file: ./.secrets/secret_store_workloads.json
  traffic_ingest_token:
    file: ./.secrets/traffic_ingest_token
  local_llm_service_token:
    file: ./.secrets/local_llm_service_token
  workflow_task_token:
    file: ./.secrets/workflow_task_token

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  neo4j-data:
  ollama-data:
