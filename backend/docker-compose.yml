services:
  postgres:
    image: postgres:16-alpine
    container_name: elyvion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elyvion
      POSTGRES_PASSWORD: elyvion
      POSTGRES_DB: elyvion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyvion"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: elyvion-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
