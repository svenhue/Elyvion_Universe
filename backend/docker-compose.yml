  agent-engine:
    build:
      context: .
      dockerfile: modules/AI-and-execution-layer/agent-engine/Dockerfile
    container_name: elyvion-agent-engine
    restart: unless-stopped
    environment:
      PORT: "8101"
      MODULE_NAME: agent-engine
      MODULE_BASE_URL: http://agent-engine:8101
      REGISTRY_URL: http://registry:3010
      AUTH_ISSUER_URL: http://localhost:3011
      AUTH_JWKS_URL: http://auth:3011
      ENVIRONMENT: development
      TRAFFIC_INGEST_URL: http://traffic:3025/internal/events
      TRAFFIC_INGEST_TOKEN_FILE: /run/secrets/traffic_ingest_token
      LOCAL_LLM_URL: http://local-llm:3028
      LOCAL_LLM_SERVICE_TOKEN_FILE: /run/secrets/local_llm_service_token
      ACTIONS_ENGINE_MCP_URL: http://actions-engine:3015/mcp
    secrets:
      - traffic_ingest_token
      - local_llm_service_token
    depends_on:
      registry:
        condition: service_healthy
      actions-engine:
        condition: service_healthy
      local-llm:
        condition: service_healthy
    healthcheck: *python-healthcheck

  ontology-engine:
    build:
      context: .
      dockerfile: modules/knowledge-layer/ontology-engine/Dockerfile
    container_name: elyvion-ontology-engine
    restart: unless-stopped
    environment:
      PORT: "8100"
      MODULE_NAME: ontology-engine
      MODULE_BASE_URL: http://ontology-engine:8100
      REGISTRY_URL: http://registry:3010
      AUTH_ISSUER_URL: http://localhost:3011
      ENVIRONMENT: development
      TRAFFIC_INGEST_URL: http://traffic:3025/internal/events
      TRAFFIC_INGEST_TOKEN_FILE: /run/secrets/traffic_ingest_token
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: elyvion-ontology
      ACTIONS_ENGINE_URL: http://actions-engine:3015
    secrets:
