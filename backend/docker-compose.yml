services:
  postgres:
    image: postgres:16-alpine
    container_name: elyvion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elyvion
      POSTGRES_PASSWORD: elyvion
      POSTGRES_DB: elyvion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyvion"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: elyvion-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  mongo:
    image: mongo:7
    container_name: elyvion-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: elyvion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: elyvion-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/elyvion-ontology
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  neo4j-data:
