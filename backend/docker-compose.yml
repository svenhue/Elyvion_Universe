      context: .
      dockerfile: Dockerfile.node-module
      args:
        MODULE_NAME: solutions
        MODULE_PATH: modules/resource-layer/solutions
    container_name: elyvion-solutions
    restart: unless-stopped
    environment:
      <<: *module-environment
      PORT: "3023"
      MODULE_NAME: solutions
      MODULE_BASE_URL: http://solutions:3023
      REGISTRY_URL: http://registry:3010
      ACTIONS_ENGINE_URL: http://actions-engine:3015
      MONGODB_URI: mongodb://mongo:27017/elyvion_solutions
      VERSION_CONTROL_URL: http://version-control:3026
    secrets:
      - traffic_ingest_token
    depends_on:
      registry:
        condition: service_healthy
      mongo:
        condition: service_healthy
      actions-engine:
        condition: service_healthy
      version-control:
        condition: service_healthy
    healthcheck: *node-healthcheck

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile.node-module
      args:
        MODULE_NAME: telemetry
        MODULE_PATH: modules/observability/telemetry
    container_name: elyvion-telemetry
    restart: unless-stopped
    environment:
      <<: *module-environment
      PORT: "3020"
      MODULE_NAME: telemetry
      MODULE_BASE_URL: http://telemetry:3020
      REGISTRY_URL: http://registry:3010
      ACTIONS_ENGINE_URL: http://actions-engine:3015
      DATABASE_URL: postgresql://elyvion:elyvion@postgres:5432/elyvion?schema=telemetry
    secrets:
      - traffic_ingest_token
    depends_on:
      registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      actions-engine:
        condition: service_healthy
    healthcheck: *node-healthcheck

  traffic:
    build:
      context: .
      dockerfile: Dockerfile.node-module
      args:
        MODULE_NAME: traffic
        MODULE_PATH: modules/observability/traffic
    container_name: elyvion-traffic
    restart: unless-stopped
    env_file:
      - ./modules/observability/traffic/.env
    environment:
      <<: *module-environment
      PORT: "3025"
      MODULE_NAME: traffic
      MODULE_BASE_URL: http://traffic:3025
      REGISTRY_URL: http://registry:3010
      DATABASE_URL: postgresql://elyvion:elyvion@postgres:5432/elyvion?schema=traffic
      SECURITY_URL: http://security:3022
      TRAFFIC_INGEST_TOKEN_FILE: /run/secrets/traffic_ingest_token
    secrets:
      - traffic_ingest_token
    depends_on:
      registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      security:
        condition: service_healthy
    healthcheck: *node-healthcheck

  version-control:
    build:
      context: .
      dockerfile: Dockerfile.node-module
      args:
        MODULE_NAME: version-control
        MODULE_PATH: modules/development-layer/version-control
    container_name: elyvion-version-control
    restart: unless-stopped
    environment:
      <<: *module-environment
      PORT: "3026"
      MODULE_NAME: version-control
      MODULE_BASE_URL: http://version-control:3026
      REGISTRY_URL: http://registry:3010
      ACTIONS_ENGINE_URL: http://actions-engine:3015
      MONGODB_URI: mongodb://mongo:27017/elyvion_version_control
    secrets:
      - traffic_ingest_token
    depends_on:
      registry:
        condition: service_healthy
      mongo:
        condition: service_healthy
      actions-engine:
        condition: service_healthy
    healthcheck: *node-healthcheck

  workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile.node-module
      args:
        MODULE_NAME: workflow-engine
        MODULE_PATH: modules/AI-and-execution-layer/workflow-engine
    container_name: elyvion-workflow-engine
    restart: unless-stopped
    environment:
      <<: *module-environment
      PORT: "3014"
      MODULE_NAME: workflow-engine
      MODULE_BASE_URL: http://workflow-engine:3014
      REGISTRY_URL: http://registry:3010
      DATABASE_URL: postgresql://elyvion:elyvion@postgres:5432/elyvion?schema=workflow_engine
      REDIS_URL: redis://redis:6379
      ACTIONS_ENGINE_URL: http://actions-engine:3015
      WORKFLOW_TASK_TOKEN_FILE: /run/secrets/workflow_task_token
    secrets:
      - traffic_ingest_token
      - workflow_task_token
    depends_on:
      registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      actions-engine:
